name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      # Validation-only version keeps build and package filenames consistent.
      PLUGIN_VERSION: '0.0.0.0'
    strategy:
      matrix:
        configuration: [Release, Release.Emby]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build plugin
        run: dotnet build --configuration ${{ matrix.configuration }} -p:Version=$PLUGIN_VERSION

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install manifest dependency
        run: python -m pip install packaging

      - name: Validate package and manifest
        run: python scripts/validate_build.py "${{ matrix.configuration }}" "$PLUGIN_VERSION"
