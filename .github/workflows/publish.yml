name: Promote tested release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful manual .NET run whose Ubuntu ZIPs were runtime tested
        required: true
        type: string
      runtime_verified:
        description: Completed Windows/Linux Jellyfin 12.0 and Emby runtime checklist on these exact ZIPs
        required: true
        default: false
        type: boolean
      runtime_evidence:
        description: Evidence URL or report with versions, hashes, staging install and runtime results
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: metatube-release
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.runtime_verified
    runs-on: ubuntu-latest
    steps:
      - name: Verify source validation run
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.run_id }}
          RUNTIME_EVIDENCE: ${{ inputs.runtime_evidence }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.SOURCE_RUN) || !process.env.RUNTIME_EVIDENCE.trim()) {
              throw new Error('Run ID and runtime evidence are required');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.SOURCE_RUN)});
            const {data: repo} = await github.rest.repos.get(context.repo);
            if (run.path !== '.github/workflows/dotnetcore.yml' || run.conclusion !== 'success' ||
                run.event !== 'workflow_dispatch' || run.head_branch !== repo.default_branch ||
                context.ref !== `refs/heads/${repo.default_branch}`) {
              throw new Error('Only a successful default-branch manual validation run can be promoted');
            }
            core.setOutput('sha', run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
      - uses: actions/checkout@v4
        with:
          ref: dist
          path: catalog
      - uses: actions/download-artifact@v4
        with:
          name: packages-ubuntu-latest
          path: packages
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifacts and prepare manifest
        id: release
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN: ${{ inputs.run_id }}
          RUNTIME_EVIDENCE: ${{ inputs.runtime_evidence }}
        run: |
          python source/scripts/validate_packages.py packages
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(Path('packages/build-evidence.json').read_text())
          assert evidence['commit'] == os.environ['EXPECTED_SHA']
          assert evidence['runId'] == os.environ['SOURCE_RUN']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={evidence["version"]}\n')
          Path('release-notes.md').write_text('Jellyfin 12.0 / .NET 10; Emby 4.9 support retained.\n\nRuntime validation:\n' + os.environ['RUNTIME_EVIDENCE'] + '\n\nBuild evidence:\n' + json.dumps(evidence, indent=2) + '\n')
          PY
          version=$(python -c 'import json; print(json.load(open("packages/build-evidence.json"))["version"])')
          python source/scripts/manifest.py "packages/Jellyfin.MetaTube@v${version}.zip" --repository "$GITHUB_REPOSITORY" --base-manifest catalog/manifest.json --output pending-manifest.json
      - name: Upload validated packages before catalog publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ steps.source.outputs.sha }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            packages/*.zip
            packages/build-evidence.json
      - name: Verify public download and update catalog
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python source/scripts/validate_packages.py packages --verify-downloads "$GITHUB_REPOSITORY"
          python source/scripts/manifest.py "packages/Jellyfin.MetaTube@v${PLUGIN_VERSION}.zip" --repository "$GITHUB_REPOSITORY" --base-manifest catalog/manifest.json --output catalog/manifest.json --verify-download
          cd catalog
          git config user.name metatube-bot
          git config user.email metatube-bot@users.noreply.github.com
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Release MetaTube ${PLUGIN_VERSION} for Jellyfin 12.0"
            git push origin HEAD:dist
          fi
