name: .NET

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        run: echo "value=$(date -u '+%Y.%-m%d.%-H%M.0')" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all configurations
        shell: pwsh
        run: |
          foreach ($configuration in @('Debug', 'Release', 'Debug.Emby', 'Release.Emby')) {
            dotnet build Jellyfin.Plugin.MetaTube/Jellyfin.Plugin.MetaTube.csproj -c $configuration -p:Version=$env:PLUGIN_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Inspect and record release packages
        shell: pwsh
        run: ./scripts/inspect-packages.ps1 -Version $env:PLUGIN_VERSION -Commit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            Jellyfin.Plugin.MetaTube/bin/*.zip
            Jellyfin.Plugin.MetaTube/bin/build-evidence.json
          if-no-files-found: error
